{% extends 'base.html' %}

{% block title %}Login | Nexus{% endblock %}

{% block content %}
<div class="animate-up" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div class="glass" style="width: 100%; max-width: 400px; padding: 2rem;">
        <h2 style="text-align: center; margin-bottom: 2rem;">Welcome Back</h2>
        <form method="POST" action="{{ url_for('main.login') }}">
            <div class="form-group">
                <label class="form-label">Email Address</label>
                <input type="email" name="email" class="form-control" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label class="form-label">Password</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn btn-primary btn-block" style="margin-top: 1rem;">Login</button>
        </form>
        <p style="text-align: center; margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">
            Don't have an account? <a href="{{ url_for('main.signup') }}" style="color: var(--accent);">Sign Up</a>
        </p>
    </div>
</div>
{% endblock %}
