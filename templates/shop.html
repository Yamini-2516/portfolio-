{% extends 'base.html' %}

{% block title %}Shop | Nexus{% endblock %}

{% block content %}
<div class="animate-up" style="margin-bottom: 2rem;">
    <h1>All Products</h1>
    <p style="color: var(--text-secondary);">Browse our collection of next-generation tech.</p>
</div>

<div class="product-grid">
    {% for product in products %}
    <div class="product-card glass">
        <a href="{{ url_for('main.product_detail', id=product.id) }}" style="text-decoration: none; color: inherit;">
            <div class="product-card-3d-wrapper canvas-container" data-model-url="{{ product.model_url }}" data-image-url="{{ product.image_url }}" data-interactive="false">
                 <div class="model-placeholder" style="background-image: url('{{ product.image_url }}')"></div>
            </div>
            <div class="product-info">
                <h3>{{ product.name }}</h3>
                <p style="color: var(--text-secondary); font-size: 0.85rem; margin-bottom: 1rem; height: 40px; overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;">
                    {{ product.description }}
                </p>
                <div class="flex-between">
                    <span class="product-price">₹{{ "{:,.2f}".format(product.price) }}</span>
                    <form action="{{ url_for('main.add_to_cart', product_id=product.id) }}" method="POST" style="display:inline;" onclick="event.stopPropagation()">
                        <button type="submit" class="btn btn-primary" style="padding: 0.5rem 1rem;"><i class="fa-solid fa-cart-plus"></i></button>
                    </form>
                </div>
            </div>
        </a>
    </div>
    {% endfor %}
</div>
{% endblock %}
